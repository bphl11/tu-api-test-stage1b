<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TU API — Monitoring Filter V4</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;color:#202938;margin:0}
.wrap{max-width:1000px;margin:30px auto;padding:20px}
.card{background:#fff;border:1px solid #dfe4ea;border-radius:14px;padding:24px;margin-bottom:18px}
button{padding:12px 16px;border:0;border-radius:9px;background:#3158a6;color:#fff;font-weight:700;cursor:pointer}
.status{display:inline-block;padding:6px 10px;border-radius:999px;background:#fef3c7;color:#92400e;font-weight:700}
.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}
input{width:100%;padding:10px;margin-top:6px;border:1px solid #d0d5dd;border-radius:8px}
pre{background:#111827;color:#e5e7eb;padding:16px;border-radius:10px;min-height:320px;white-space:pre-wrap;overflow:auto}
</style>
<script>
document.write('<scr'+'ipt src="assets/js/tu-config.js"><\/scr'+'ipt>');
setTimeout(function(){
  if(window.TU_CONFIG) TU_CONFIG.TU_API_URL="https://script.google.com/macros/s/AKfycbyLfDwll2EOs6fbUTZ3a7asENik4cjes_WCRqdCwN5gVTH5B5wM5l60NOIZOIbr7JjnjQ/exec";
},0);
</script>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>TU API TEST — Monitoring FILTER V4</h1>
<p>Read-only · <b>TU-2026-000356</b> · langsung ke staging optimized.</p>
<div id="tuLoginPanel">
<div id="googleSignInButton" style="min-height:44px"></div>
<div id="tuLoginLoading"></div>
<div id="tuAuthMessage"></div>
</div>
<div id="tuAppPanel" style="display:none">
<div>Status Login: <span id="tuLoginStatus" class="status">Belum login</span></div>
<div id="tuUserBox">
<b id="tuUserName"></b><br><span id="tuUserEmail"></span>
</div>
</div>
</div>
<div id="monitoringCard" class="card" style="display:none">
<h2>tu_monitoring — FILTER</h2>
<input id="idTu" value="TU-2026-000356" readonly>
<input id="tahun" value="2026" readonly>
<button id="btn">TEST FILTER</button>
</div>
<div class="card"><h2>HASIL</h2><pre id="out">Belum ada pengujian.</pre></div>
</div>

<script src="assets/js/tu-api.js"></script>
<script>
(function(){
  const output=document.getElementById("out");
  const loginPanel=document.getElementById("tuLoginPanel");
  const appPanel=document.getElementById("tuAppPanel");
  const card=document.getElementById("monitoringCard");
  const status=document.getElementById("tuLoginStatus");

  window.tuShowLogin=function(){loginPanel.style.display="";appPanel.style.display="none";card.style.display="none";};
  window.tuShowMessage=function(m){document.getElementById("tuAuthMessage").textContent=m||"";};
  window.tuHandleBootstrap=function(d){if(d&&d.user){loginPanel.style.display="none";appPanel.style.display="";card.style.display="";status.textContent="LOGIN BERHASIL — OPERATOR";status.className="status ok";document.getElementById("tuUserName").textContent=d.user.name||"";document.getElementById("tuUserEmail").textContent=d.user.email||"";}};
  window.tuInitData=window.tuHandleBootstrap;
})();
</script>
<script src="assets/js/tu-auth.js"></script>
<script>
document.getElementById("btn").addEventListener("click",async function(){
  this.disabled=true;
  const out=document.getElementById("out");
  out.textContent="Menjalankan tu_monitoring filter TU-2026-000356...";
  const t=performance.now();
  try{
    const data=await tuApiRequest("tu_monitoring",{tahun:2026,id_tu:"TU-2026-000356"});
    out.textContent=JSON.stringify({http:200,waktu_detik:Number(((performance.now()-t)/1000).toFixed(2)),hasil:data},null,2);
  }catch(e){
    out.textContent=JSON.stringify({ok:false,error:e.message||String(e),waktu_detik:Number(((performance.now()-t)/1000).toFixed(2))},null,2);
  }finally{this.disabled=false;}
});
</script>
</body>
</html>
