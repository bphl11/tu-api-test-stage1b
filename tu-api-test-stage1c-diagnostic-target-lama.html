<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TU API — Diagnostic TARGET Lama</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;color:#202938;margin:0}
.wrap{max-width:960px;margin:30px auto;padding:20px}
.card{background:#fff;border:1px solid #dfe4ea;border-radius:14px;padding:24px;margin-bottom:18px}
.status{display:inline-block;padding:6px 10px;border-radius:999px;background:#fef3c7;color:#92400e;font-weight:700}
.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}
button{padding:12px 16px;border:0;border-radius:9px;background:#3158a6;color:#fff;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
pre{background:#111827;color:#e5e7eb;padding:16px;border-radius:10px;min-height:280px;white-space:pre-wrap;overflow:auto}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.metric{padding:12px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px}
.metric b{display:block;font-size:18px;margin-top:4px}
.note{margin-top:14px;padding:12px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:9px;color:#1e3a8a}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>TU API — Diagnostic TARGET Lama</h1>
<p>Read-only · GitHub Pages → Diagnostic Worker → TARGET lama Apps Script.</p>
<div id="googleSignInButton"></div>
<div id="status" class="status" style="margin-top:10px">Menunggu login...</div>
<div id="info" style="margin-top:8px"></div>
</div>

<div id="testCard" class="card" style="display:none">
<h2>tu_monitoring FULL 2026</h2>
<div class="note">Tidak ada id_tu. Tidak ada SAVE, UPDATE, DELETE, atau perubahan data.</div>
<button id="run" style="margin-top:14px">UJI TARGET LAMA</button>
<div class="meta">
<div class="metric">HTTP<b id="http">-</b></div>
<div class="metric">Upstream<b id="up">-</b></div>
<div class="metric">Total Worker<b id="total">-</b></div>
</div>
</div>

<div class="card"><h2>HASIL</h2><pre id="out">Belum ada pengujian.</pre></div>
</div>

<script>
(function(){
const WORKER="https://tu-p3hpl-diagnostic.asterales-niza.workers.dev";
const DIAG=WORKER+"/diag";
const CLIENT_ID="443412026871-pqoa9tskrfkaffp5u2ohjhtq1l0ds2r1.apps.googleusercontent.com";
let token="";

const status=document.getElementById("status");
const info=document.getElementById("info");
const testCard=document.getElementById("testCard");
const out=document.getElementById("out");
const http=document.getElementById("http");
const up=document.getElementById("up");
const total=document.getElementById("total");

async function post(url,payload){
 const res=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload),cache:"no-store"});
 const raw=await res.text(); let data;
 try{data=JSON.parse(raw)}catch(e){throw new Error("HTTP "+res.status+" — respons bukan JSON: "+raw.slice(0,500))}
 return {status:res.status,data};
}
async function login(resp){
 token=String(resp?.credential||"").trim();
 if(!token){status.textContent="LOGIN GAGAL";status.className="status bad";return}
 status.textContent="Memverifikasi...";
 try{
  const r=await post(DIAG,{action:"tu_bootstrap",id_token:token,tahun:2026});
  if(r.status!==200||r.data?.ok!==true)throw new Error(r.data?.message||("HTTP "+r.status));
  const u=r.data?.user||{};
  if(String(u.role||"").toUpperCase()!=="OPERATOR")throw new Error("Akses hanya untuk Operator.");
  status.textContent="LOGIN BERHASIL — OPERATOR";status.className="status ok";
  info.textContent=(u.name||"")+" · "+(u.email||"");
  testCard.style.display="";
 }catch(e){
  token="";status.textContent="LOGIN GAGAL";status.className="status bad";info.textContent=e.message||String(e);
 }
}
function init(){
 if(!window.google?.accounts?.id){status.textContent="Google belum siap";status.className="status bad";return}
 google.accounts.id.initialize({client_id:CLIENT_ID,callback:login,auto_select:false,cancel_on_tap_outside:true});
 google.accounts.id.renderButton(document.getElementById("googleSignInButton"),{theme:"outline",size:"large",text:"signin_with",shape:"rectangular",width:300});
}
let n=0;const timer=setInterval(()=>{n++;if(window.google?.accounts?.id){clearInterval(timer);init()}else if(n>=40){clearInterval(timer);init()}},250);

document.getElementById("run").onclick=async function(){
 this.disabled=true;out.textContent="Menjalankan diagnostic TARGET lama...";http.textContent="-";up.textContent="-";total.textContent="-";
 try{
  const r=await post(DIAG,{action:"tu_monitoring",id_token:token,tahun:2026});
  const d=r.data?.diagnostic||{};
  http.textContent=String(r.status);
  up.textContent=(Number(d.upstream_ms||0)/1000).toFixed(2)+" detik";
  total.textContent=(Number(d.worker_total_ms||0)/1000).toFixed(2)+" detik";
  out.textContent=JSON.stringify(r.data,null,2);
 }catch(e){
  out.textContent=JSON.stringify({ok:false,error:e.message||String(e)},null,2);
 }finally{this.disabled=false}
}
})();
</script>
</body>
</html>
